# Mises à jour des actions (figées par SHA) et des dépendances npm ; messages
# Conventional Commits pour passer la vérification repogarde.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Sans scope : titres de PR courts (72 caractères max, vérifiés en CI)
      prefix: build
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Fixé sur la version minimale de VS Code supportée (engines.vscode)
      - dependency-name: "@types/vscode"
      # Types de la version de Node embarquée par VS Code, pas de la dernière
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
