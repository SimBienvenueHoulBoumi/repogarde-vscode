name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lancé par le workflow de release sur sa PR (GITHUB_TOKEN ne déclenche que ce type)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Aucun script d'installation : rien d'exécuté depuis les dépendances
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tests d'intégration (VS Code réel)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm run test:integration
          else npm run test:integration; fi

  # Le paquet .vsix se construit et ne contient que le nécessaire
  paquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vsce package --no-dependencies -o repogarde.vsix
      - name: Contenu du paquet
        run: |
          unzip -l repogarde.vsix
          if unzip -l repogarde.vsix | grep -E 'node_modules|src/|test/|\.map$'; then
            echo "✖ Fichiers inattendus dans le paquet"; exit 1
          fi

  # Le projet respecte ses propres règles
  repogarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SimBienvenueHoulBoumi/repogarde@0aa04d718a4b0d0e5e120d3b1430f5cd475be4f2 # v2.1.2
        with:
          strict: true
          checks: commits branch secrets
