# Releases et publication automatiques, sans jeton personnel :
# 1. release-auto (repogarde) tient à jour la PR de release (changelog, version
#    du package.json), la fait valider par la CI, la merge, crée tag et release ;
# 2. le .vsix est construit une fois depuis le tag, attesté (provenance
#    Sigstore) et joint à la release ;
# 3. la publication (Marketplace VS Code, Open VSX) attend l'approbation de
#    l'environnement « production ».
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une release à la fois ; un nouveau push attend la fin de la précédente
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    uses: SimBienvenueHoulBoumi/repogarde/.github/workflows/release-auto.yml@v2
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write

  paquet:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # joindre le .vsix à la release
      id-token: write # attestation de provenance (Sigstore)
      attestations: write
    outputs:
      fichier: ${{ steps.paquet.outputs.fichier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Construire le .vsix
        id: paquet
        env:
          # Identifiant d'éditeur (variable de dépôt PUBLISHER, posée par
          # scripts/configurer-publication.sh)
          PUBLISHER: ${{ vars.PUBLISHER }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          [ -z "$PUBLISHER" ] || npm pkg set publisher="$PUBLISHER"
          fichier="repogarde-${TAG#v}.vsix"
          npx vsce package --no-dependencies -o "$fichier"
          echo "fichier=$fichier" >>"$GITHUB_OUTPUT"
      # Vérifiable avec : gh attestation verify <fichier>.vsix --repo <dépôt>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.paquet.outputs.fichier }}
      - name: Joindre à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
          FICHIER: ${{ steps.paquet.outputs.fichier }}
        run: gh release upload "$TAG" "$FICHIER" --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ${{ steps.paquet.outputs.fichier }}
          retention-days: 7

  # Publication : un job par place de marché (l'une peut échouer sans bloquer
  # l'autre, et être relancée seule). Sans jeton configuré : ignorée, avec un
  # avertissement.
  publier:
    name: publier (${{ matrix.cible }})
    needs: paquet
    strategy:
      fail-fast: false
      matrix:
        cible: [marketplace, open-vsx]
    runs-on: ubuntu-latest
    # Publication soumise à approbation ; jetons VSCE_PAT et OVSX_PAT en secrets
    # de cet environnement, inaccessibles avant l'approbation
    environment: production
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Publier
        env:
          CIBLE: ${{ matrix.cible }}
          FICHIER: ${{ needs.paquet.outputs.fichier }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ "$CIBLE" = marketplace ]; then
            if [ -z "$VSCE_PAT" ]; then
              echo "::warning::VSCE_PAT absent : publication Marketplace ignorée (lancer scripts/configurer-publication.sh)"
              exit 0
            fi
            npx -y @vscode/vsce@4.0.0 publish --packagePath "$FICHIER"
          else
            if [ -z "$OVSX_PAT" ]; then
              echo "::warning::OVSX_PAT absent : publication Open VSX ignorée (lancer scripts/configurer-publication.sh)"
              exit 0
            fi
            npx -y ovsx@1.2.0 publish "$FICHIER"
          fi
