# Releases et publication entièrement automatiques, sans jeton personnel :
# 1. release-please tient à jour une PR "release x.y.z" (changelog + version
#    du package.json) ;
# 2. ce workflow déclenche la CI sur cette PR (workflow_dispatch : seul type
#    d'événement que GITHUB_TOKEN a le droit de déclencher) et attend sa fin.
#    GitHub ne rattache pas ces vérifications à la PR : leur résultat réel est
#    reporté en statuts sur le commit, puis la PR est mergée (squash) ;
# 3. release-please, relancé dans le même run, crée le tag vX.Y.Z et la release ;
# 4. le .vsix est construit depuis le tag, attesté (provenance Sigstore), joint
#    à la release, puis publié sur le Marketplace VS Code et Open VSX.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une release à la fois ; un nouveau push attend la fin de la précédente
concurrency:
  group: release
  cancel-in-progress: false

# Aucun droit par défaut : chaque job déclare le strict nécessaire
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: write # déclencher la CI sur la PR de release
      checks: read
      statuses: write # reporter le résultat de cette CI sur le commit
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: CI sur la PR de release, puis merge
        id: merge
        # PR créée ou mise à jour par ce run, sinon PR déjà ouverte restée en
        # attente (release-please ne la renvoie que s'il la modifie)
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # pas de checkout : dépôt explicite pour gh
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          if [ -n "$PR_JSON" ]; then
            pr="$(jq -r .number <<<"$PR_JSON")"
          else
            pr="$(gh pr list --state open --base main --label 'autorelease: pending' \
              --json number -q '.[0].number')"
          fi
          [ -n "$pr" ] || { echo "Aucune PR de release en attente"; exit 0; }
          branch="$(gh pr view "$pr" --json headRefName -q .headRefName)"
          # main peut avancer pendant la CI (PR « BEHIND », merge refusé) : la
          # branche est alors mise à jour depuis main et la CI relancée
          for tentative in 1 2 3; do
            # Commit lu sur la branche ; la PR peut l'afficher avec un léger
            # retard : on attend qu'elle suive (sinon --match-head-commit échoue)
            sha="$(gh api "repos/$GH_REPO/commits/$branch" --jq .sha)"
            for _ in $(seq 1 30); do
              [ "$(gh pr view "$pr" --json headRefOid -q .headRefOid)" = "$sha" ] && break
              sleep 5
            done
            echo "PR #$pr ($branch @ ${sha:0:7}) : lancement de la CI (tentative $tentative)"
            gh workflow run ci.yml --ref "$branch"
            # CodeQL aussi : chaque commit de main doit être analysé
            gh workflow run codeql.yml --ref "$branch"
            run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch \
                --commit "$sha" --limit 1 --json databaseId -q '.[0].databaseId')"
              [ -n "$run_id" ] && break
              sleep 5
            done
            [ -n "$run_id" ] || { echo "✖ Run de CI introuvable"; exit 1; }
            gh run watch "$run_id" --exit-status --interval 30 >/dev/null
            run_url="$(gh run view "$run_id" --json url -q .url)"
            # Vérifications exigées par la protection de main : résultat réel de
            # chacune, reporté en statut sur le commit
            gh api "repos/$GH_REPO/rules/branches/main" \
              --jq '.[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context' |
              while IFS= read -r ctx; do
                conclusion="$(gh run view "$run_id" --json jobs \
                  -q ".jobs[] | select(.name==\"$ctx\") | .conclusion")"
                if [ "$conclusion" != success ]; then
                  echo "✖ $ctx : ${conclusion:-absent}"
                  exit 1
                fi
                gh api "repos/$GH_REPO/statuses/$sha" -f state=success -f context="$ctx" \
                  -f target_url="$run_url" -f description="CI de la PR de release" >/dev/null
                echo "✔ $ctx"
              done
            # D'autres vérifications peuvent aussi tourner sur la PR (workflows
            # pull_request) : on attend que GitHub la déclare mergeable (toutes
            # les vérifications terminées et vertes) ; sinon, pas de merge.
            for _ in $(seq 1 90); do
              state="$(gh pr view "$pr" --json mergeStateStatus -q .mergeStateStatus)"
              case "$state" in
                CLEAN | BEHIND) break ;;
                BLOCKED | UNKNOWN | UNSTABLE) sleep 30 ;;
                *) echo "✖ PR #$pr non mergeable : $state"; exit 1 ;;
              esac
            done
            if [ "$state" = BEHIND ]; then
              echo "↻ main a avancé pendant la CI : mise à jour de la PR #$pr"
              gh pr update-branch "$pr"
              sleep 10
              continue
            fi
            [ "$state" = CLEAN ] || { echo "✖ PR #$pr toujours $state après 45 min"; exit 1; }
            gh pr merge "$pr" --squash --match-head-commit "$sha"
            echo "merged=true" >>"$GITHUB_OUTPUT"
            exit 0
          done
          echo "✖ PR #$pr toujours en retard sur main après 3 tentatives"
          exit 1

      # Le merge fait par GITHUB_TOKEN ne relance pas ce workflow : on publie ici
      - id: publish
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # .vsix construit une seule fois depuis le tag, puis publié tel quel partout
  paquet:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # joindre le .vsix à la release
      id-token: write # attestation de provenance (Sigstore)
      attestations: write
    outputs:
      fichier: ${{ steps.paquet.outputs.fichier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Construire le .vsix
        id: paquet
        env:
          # Identifiant d'éditeur (variable de dépôt PUBLISHER, posée par
          # scripts/configurer-publication.sh)
          PUBLISHER: ${{ vars.PUBLISHER }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          [ -z "$PUBLISHER" ] || npm pkg set publisher="$PUBLISHER"
          fichier="repogarde-${TAG#v}.vsix"
          npx vsce package --no-dependencies -o "$fichier"
          echo "fichier=$fichier" >>"$GITHUB_OUTPUT"
      # Vérifiable avec : gh attestation verify <fichier>.vsix --repo <dépôt>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.paquet.outputs.fichier }}
      - name: Joindre à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          FICHIER: ${{ steps.paquet.outputs.fichier }}
        run: gh release upload "$TAG" "$FICHIER" --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: ${{ steps.paquet.outputs.fichier }}
          retention-days: 7

  # Publication : un job par place de marché (l'une peut échouer sans bloquer
  # l'autre, et être relancée seule). Sans jeton configuré : ignorée, avec un
  # avertissement.
  publier:
    name: publier (${{ matrix.cible }})
    needs: paquet
    strategy:
      fail-fast: false
      matrix:
        cible: [marketplace, open-vsx]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Publier
        env:
          CIBLE: ${{ matrix.cible }}
          FICHIER: ${{ needs.paquet.outputs.fichier }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ "$CIBLE" = marketplace ]; then
            if [ -z "$VSCE_PAT" ]; then
              echo "::warning::VSCE_PAT absent : publication Marketplace ignorée (lancer scripts/configurer-publication.sh)"
              exit 0
            fi
            npx -y @vscode/vsce@4.0.0 publish --packagePath "$FICHIER"
          else
            if [ -z "$OVSX_PAT" ]; then
              echo "::warning::OVSX_PAT absent : publication Open VSX ignorée (lancer scripts/configurer-publication.sh)"
              exit 0
            fi
            npx -y ovsx@1.2.0 publish "$FICHIER"
          fi
