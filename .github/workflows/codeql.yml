# Analyse de sécurité CodeQL : code de l'extension et workflows GitHub Actions
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  # Lancé par le workflow de release sur sa PR (analyse de chaque commit de main)
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"

permissions: {}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
